<h2>Shadow DOM CDN usage</h2>

<p><strong>Note:</strong> Open the console for additional logs.</p>

<app-shadow-root-mode-select [(mode)]="mode" />

<p>
	<button (click)="toggleDisableEditors()">{{ isDisabled() ? 'Enable editors' : 'Disable editors' }}</button>
</p>

<h3>Classic build</h3>

<app-shadow-root-host
	[mode]="mode()"
	(attached)="onShadowRootAttached( $event )">
	<ng-template>
		@if ( Editor ) {
			<ckeditor
				[data]="editorData"
				[editor]="Editor"
				[config]="config"
				[disabled]="isDisabled()"
				id="classic-editor"
				name="classic-editor"

				(ready)="onReady()"
				(change)="onChange()"
				(focus)="onFocus()"
				(error)="onError($event)"
				(blur)="onBlur()">
			</ckeditor>
		}
	</ng-template>
</app-shadow-root-host>

<h4>Component events:</h4>
<ul>
	@for ( eventInfo of componentEvents; track $index ) {
		<li><span>{{ eventInfo }}</span></li>
	}
</ul>
