<h2>Initialization crash demo</h2>

<ng-container *ngIf="errorOccurred; then errorMessage; else editor">

</ng-container>

<ng-template #editor>
	<ckeditor data="Crash demo" [config]="config" [editor]="Editor" (error)="onError($event)">
	</ckeditor>
</ng-template>

<ng-template #errorMessage>
	<p>An error has occurred, please contact us at: support&#64;company.com to resolve the situation.</p>
</ng-template>

<div class="alert-box">
	An editor that fails to start is reported through the <code>error</code> output, once. It is the
	application that decides what to show instead — here, the message above.
</div>
